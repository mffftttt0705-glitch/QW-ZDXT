<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>QW电竞 · 控制终端</title>
<meta name="robots" content="noindex,nofollow" />
<style>
  :root {
    --bg: #0b0f14;
    --panel: #121820;
    --panel2: #1a222d;
    --border: #243041;
    --text: #e8eef6;
    --muted: #8b9bb0;
    --accent: #3b82f6;
    --ok: #22c55e;
    --warn: #f59e0b;
    --danger: #ef4444;
    --purple: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  button, input, select, textarea { font: inherit; }
  .hidden { display: none !important; }

  /* Login */
  #loginPage {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(59,130,246,.15), transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(167,139,250,.1), transparent 50%),
      var(--bg);
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  .login-card h1 {
    font-size: 22px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .login-card .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .form-control {
    width: 100%;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 12px;
    color: var(--text);
    outline: none;
  }
  .form-control:focus { border-color: var(--accent); }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ok { background: var(--ok); color: #052e16; }
  .btn-warn { background: var(--warn); color: #1c1400; }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .btn-block { width: 100%; }
  .error-text { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }

  /* Layout */
  #app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    flex-shrink: 0;
  }
  .sidebar .brand {
    padding: 18px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar nav { flex: 1; overflow-y: auto; padding: 10px 8px; }
  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    margin-bottom: 2px;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
  }
  .nav-item:hover { background: var(--panel2); color: var(--text); }
  .nav-item.active { background: rgba(59,130,246,.15); color: #93c5fd; }
  .sidebar .foot {
    padding: 12px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--muted);
  }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar h2 { font-size: 16px; font-weight: 700; }
  .topbar .right { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
  .content { padding: 18px 20px 40px; }

  /* Cards / tables */
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); margin-bottom: 18px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .stat .label { font-size: 12px; color: var(--muted); }
  .stat .value { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
  }
  .badge-ok { background: rgba(34,197,94,.15); color: #4ade80; }
  .badge-warn { background: rgba(245,158,11,.15); color: #fbbf24; }
  .badge-danger { background: rgba(239,68,68,.15); color: #f87171; }
  .badge-muted { background: rgba(139,155,176,.15); color: var(--muted); }
  .badge-blue { background: rgba(59,130,246,.15); color: #93c5fd; }
  .actions { display: flex; gap: 4px; flex-wrap: wrap; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; font-size: 13px; }
  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: #1e293b;
    border: 1px solid var(--border);
    color: #fff;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 9999;
    opacity: 0;
    transition: .25s;
    max-width: 90vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.ok { border-color: var(--ok); }
  .toast.err { border-color: var(--danger); }
  .modal-mask {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000; padding: 16px;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    width: 100%;
    max-width: 420px;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal h3 { margin-bottom: 12px; font-size: 16px; }
  .row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
  }
  .status-dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .status-dot.off { background: var(--danger); }
  @media (max-width: 800px) {
    #app { flex-direction: column; }
    .sidebar {
      width: 100%;
      height: auto;
      position: relative;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .sidebar nav {
      display: flex;
      overflow-x: auto;
      padding: 8px;
      gap: 4px;
    }
    .nav-item { white-space: nowrap; margin: 0; flex-shrink: 0; }
    .sidebar .foot { display: none; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="loginPage">
  <div class="login-card">
    <h1>🖥️ 控制终端</h1>
    <p class="sub">QW电竞平台独立管理控制台 · 仅管理员可登录</p>
    <div class="form-group">
      <label>API 地址（主站域名，末尾不要 /）</label>
      <input class="form-control" id="apiBaseInput" placeholder="https://你的主站域名" />
    </div>
    <div class="form-group">
      <label>管理员用户名</label>
      <input class="form-control" id="loginUser" placeholder="用户名" autocomplete="username" />
    </div>
    <div class="form-group">
      <label>密码</label>
      <input class="form-control" id="loginPass" type="password" placeholder="密码" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">登录控制终端</button>
    <div class="error-text" id="loginErr"></div>
    <p style="margin-top:14px;font-size:11px;color:var(--muted);line-height:1.5;">
      提示：API 地址填写主站完整域名，例如 <code style="color:#93c5fd">https://xxx.pages.dev</code>。<br>
      若控制终端与主站同域部署，可填空或填当前域名。
    </p>
  </div>
</div>

<!-- 主界面 -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand">🖥️ 控制终端</div>
    <nav>
      <button class="nav-item active" data-page="dashboard" onclick="goPage('dashboard')">📊 总览</button>
      <button class="nav-item" data-page="users" onclick="goPage('users')">👥 用户管理</button>
      <button class="nav-item" data-page="orders" onclick="goPage('orders')">📋 订单管理</button>
      <button class="nav-item" data-page="recharges" onclick="goPage('recharges')">💎 充值审核</button>
      <button class="nav-item" data-page="withdrawals" onclick="goPage('withdrawals')">💰 提现审核</button>
      <button class="nav-item" data-page="diamond" onclick="goPage('diamond')">➕ 红钻操作</button>
      <button class="nav-item" data-page="shops" onclick="goPage('shops')">🏪 店铺列表</button>
      <button class="nav-item" data-page="products" onclick="goPage('products')">📦 商品列表</button>
      <button class="nav-item" data-page="announce" onclick="goPage('announce')">📢 公告</button>
      <button class="nav-item" data-page="settings" onclick="goPage('settings')">⚙️ 设置</button>
    </nav>
    <div class="foot">
      <div id="sideUser">—</div>
      <button class="btn btn-ghost btn-sm" style="margin-top:8px;width:100%;" onclick="doLogout()">退出登录</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">总览</h2>
      <div class="right">
        <span><span class="status-dot" id="healthDot"></span> <span id="healthText">检测中</span></span>
        <span id="topApi" style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
(function () {
  const STORAGE_TOKEN = 'qw_ctrl_token';
  const STORAGE_API = 'qw_ctrl_api';
  const STORAGE_USER = 'qw_ctrl_user';
  const ADMIN_DELETE_PASSWORD = '@#555aaa';

  let token = localStorage.getItem(STORAGE_TOKEN) || '';
  let apiBase = (localStorage.getItem(STORAGE_API) || '').replace(/\/$/, '');
  let currentUser = null;
  try { currentUser = JSON.parse(localStorage.getItem(STORAGE_USER) || 'null'); } catch (e) {}

  const titles = {
    dashboard: '总览',
    users: '用户管理',
    orders: '订单管理',
    recharges: '充值审核',
    withdrawals: '提现审核',
    diamond: '红钻操作',
    shops: '店铺列表',
    products: '商品列表',
    announce: '公告管理',
    settings: '设置'
  };

  function $(id) { return document.getElementById(id); }

  function toast(msg, type) {
    const el = $('toast');
    el.textContent = msg;
    el.className = 'toast show ' + (type === 'error' ? 'err' : 'ok');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => { el.className = 'toast'; }, 2800);
  }

  function apiUrl(path) {
    const p = path.startsWith('/') ? path : '/' + path;
    if (!apiBase) return '/api' + p.replace(/^\/api/, '');
    // apiBase is site origin, API is origin + /api + path
    if (p.startsWith('/api')) return apiBase + p;
    return apiBase + '/api' + p;
  }

  async function api(path, options = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = token;
    if (options.headers) Object.assign(headers, options.headers);
    const res = await fetch(apiUrl(path), { ...options, headers });
    if (!res.ok) {
      let msg = '请求失败 (' + res.status + ')';
      try {
        const j = await res.json();
        msg = j.error || j.message || msg;
      } catch (e) {}
      throw new Error(msg);
    }
    const text = await res.text();
    if (!text) return {};
    try { return JSON.parse(text); } catch (e) { return {}; }
  }

  function showModal(html) {
    $('modalRoot').innerHTML = `<div class="modal-mask" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
  }
  function closeModal() { $('modalRoot').innerHTML = ''; }
  window.closeModal = closeModal;

  // ---------- Auth ----------
  async function doLogin() {
    const base = ($('apiBaseInput').value || '').trim().replace(/\/$/, '');
    const username = ($('loginUser').value || '').trim();
    const password = ($('loginPass').value || '').trim();
    $('loginErr').textContent = '';
    if (!username || !password) {
      $('loginErr').textContent = '请输入用户名和密码';
      return;
    }
    apiBase = base;
    localStorage.setItem(STORAGE_API, apiBase);
    $('loginBtn').disabled = true;
    try {
      const data = await api('/login', {
        method: 'POST',
        body: JSON.stringify({ username, password })
      });
      if (!data.user || data.user.role !== 'admin') {
        throw new Error('仅管理员可登录控制终端');
      }
      token = data.token;
      currentUser = data.user;
      localStorage.setItem(STORAGE_TOKEN, token);
      localStorage.setItem(STORAGE_USER, JSON.stringify(currentUser));
      enterApp();
      toast('登录成功', 'ok');
    } catch (err) {
      $('loginErr').textContent = err.message || '登录失败';
    } finally {
      $('loginBtn').disabled = false;
    }
  }
  window.doLogin = doLogin;

  function doLogout() {
    token = '';
    currentUser = null;
    localStorage.removeItem(STORAGE_TOKEN);
    localStorage.removeItem(STORAGE_USER);
    $('app').classList.add('hidden');
    $('loginPage').classList.remove('hidden');
    $('apiBaseInput').value = apiBase;
  }
  window.doLogout = doLogout;

  function enterApp() {
    $('loginPage').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('sideUser').textContent = (currentUser && currentUser.username) ? (currentUser.username + ' · admin') : '管理员';
    $('topApi').textContent = apiBase || location.origin;
    goPage('dashboard');
    checkHealth();
  }

  // ---------- Navigation ----------
  function goPage(name) {
    document.querySelectorAll('.nav-item').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-page') === name);
    });
    $('pageTitle').textContent = titles[name] || name;
    const renderers = {
      dashboard: renderDashboard,
      users: renderUsers,
      orders: renderOrders,
      recharges: renderRecharges,
      withdrawals: renderWithdrawals,
      diamond: renderDiamond,
      shops: renderShops,
      products: renderProducts,
      announce: renderAnnounce,
      settings: renderSettings
    };
    (renderers[name] || renderDashboard)();
  }
  window.goPage = goPage;

  async function checkHealth() {
    try {
      const h = await api('/health');
      $('healthDot').className = 'status-dot on';
      $('healthText').textContent = 'API 正常';
      return h;
    } catch (e) {
      $('healthDot').className = 'status-dot off';
      $('healthText').textContent = 'API 异常';
      return null;
    }
  }

  // ---------- Pages ----------
  async function renderDashboard() {
    const box = $('pageContent');
    box.innerHTML = '<div class="empty">加载中...</div>';
    try {
      const [users, orders, recharges, withdrawals, shops, products, health] = await Promise.all([
        api('/admin/users').catch(() => []),
        api('/admin/orders').catch(() => []),
        api('/admin/recharges').catch(() => []),
        api('/admin/withdrawals').catch(() => []),
        api('/shops').catch(() => []),
        api('/admin/products').catch(() => []),
        checkHealth()
      ]);
      const u = Array.isArray(users) ? users : [];
      const o = Array.isArray(orders) ? orders : [];
      const r = Array.isArray(recharges) ? recharges : [];
      const w = Array.isArray(withdrawals) ? withdrawals : [];
      const s = Array.isArray(shops) ? shops : [];
      const p = Array.isArray(products) ? products : [];
      const pendingR = r.filter(x => x.status === 'pending').length;
      const pendingW = w.filter(x => x.status === 'pending').length;
      const pendingH = u.filter(x => x.status === 'pending').length;
      box.innerHTML = `
        <div class="grid">
          <div class="stat"><div class="label">用户总数</div><div class="value">${u.length}</div></div>
          <div class="stat"><div class="label">待审核用户</div><div class="value" style="color:var(--warn)">${pendingH}</div></div>
          <div class="stat"><div class="label">订单总数</div><div class="value">${o.length}</div></div>
          <div class="stat"><div class="label">待审充值</div><div class="value" style="color:var(--warn)">${pendingR}</div></div>
          <div class="stat"><div class="label">待审提现</div><div class="value" style="color:var(--warn)">${pendingW}</div></div>
          <div class="stat"><div class="label">店铺</div><div class="value">${s.length}</div></div>
          <div class="stat"><div class="label">商品</div><div class="value">${p.length}</div></div>
          <div class="stat"><div class="label">API</div><div class="value" style="font-size:16px;margin-top:10px;">${health ? '✅ 正常' : '❌ 异常'}</div></div>
        </div>
        <div class="card">
          <div class="card-title">快捷操作</div>
          <div class="toolbar">
            <button class="btn btn-primary btn-sm" onclick="goPage('recharges')">充值审核</button>
            <button class="btn btn-warn btn-sm" onclick="goPage('withdrawals')">提现审核</button>
            <button class="btn btn-ghost btn-sm" onclick="goPage('users')">用户管理</button>
            <button class="btn btn-ghost btn-sm" onclick="goPage('diamond')">红钻操作</button>
            <button class="btn btn-ghost btn-sm" onclick="checkHealth();toast('已刷新健康状态','ok')">刷新 API 状态</button>
          </div>
        </div>
      `;
    } catch (err) {
      box.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }

  function roleText(r) {
    return ({ admin: '管理员', boss: '老板', handler: '打手', dispatcher: '派单', service: '客服' })[r] || r || '-';
  }
  function statusBadge(st) {
    if (st === 'active') return '<span class="badge badge-ok">正常</span>';
    if (st === 'pending') return '<span class="badge badge-warn">待审核</span>';
    if (st === 'banned') return '<span class="badge badge-danger">封禁</span>';
    return `<span class="badge badge-muted">${st || '-'}</span>`;
  }

  async function renderUsers() {
    const box = $('pageContent');
    box.innerHTML = '<div class="empty">加载中...</div>';
    try {
      const users = await api('/admin/users');
      const list = Array.isArray(users) ? users : [];
      window._ctrlUsers = list;
      box.innerHTML = `
        <div class="card">
          <div class="card-title">
            <span>用户列表（${list.length}）</span>
            <button class="btn btn-ghost btn-sm" onclick="renderUsers()">刷新</button>
          </div>
          <div class="toolbar">
            <input class="form-control" id="userSearch" placeholder="搜索用户名 / ID" style="max-width:220px;" oninput="filterUsers()" />
            <select class="form-control" id="userFilter" style="max-width:140px;" onchange="filterUsers()">
              <option value="all">全部角色</option>
              <option value="admin">管理员</option>
              <option value="boss">老板</option>
              <option value="handler">打手</option>
              <option value="dispatcher">派单</option>
              <option value="service">客服</option>
              <option value="pending">待审核</option>
            </select>
          </div>
          <div class="table-wrap" id="usersTable"></div>
        </div>
      `;
      filterUsers();
    } catch (err) {
      box.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }
  window.renderUsers = renderUsers;

  function filterUsers() {
    const q = (($('userSearch') && $('userSearch').value) || '').toLowerCase().trim();
    const f = ($('userFilter') && $('userFilter').value) || 'all';
    let list = window._ctrlUsers || [];
    if (f === 'pending') list = list.filter(u => u.status === 'pending');
    else if (f !== 'all') list = list.filter(u => u.role === f);
    if (q) list = list.filter(u => String(u.username || '').toLowerCase().includes(q) || String(u.id || '').includes(q));
    const el = $('usersTable');
    if (!el) return;
    if (!list.length) { el.innerHTML = '<div class="empty">暂无用户</div>'; return; }
    el.innerHTML = `<table><thead><tr>
      <th>ID</th><th>用户名</th><th>角色</th><th>红钻</th><th>状态</th><th>操作</th>
    </tr></thead><tbody>
    ${list.map(u => `<tr>
      <td>${u.id}</td>
      <td>${esc(u.username)}</td>
      <td>${roleText(u.role)}</td>
      <td>${u.diamond || 0}</td>
      <td>${statusBadge(u.status)}</td>
      <td><div class="actions">
        ${u.status === 'pending' ? `<button class="btn btn-ok btn-sm" onclick="approveUser('${u.id}')">审核</button>` : ''}
        ${u.role !== 'admin' ? `<button class="btn btn-warn btn-sm" onclick="banUser('${u.id}')">${u.status === 'banned' ? '解禁' : '封禁'}</button>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="resetPwd('${u.id}')">重置密码</button>
        <button class="btn btn-ghost btn-sm" onclick="promptChangeId('${u.id}')">改ID</button>
        <button class="btn btn-danger btn-sm" onclick="deleteUserPrompt('${u.id}',${u.role === 'admin'})">删除</button>
      </div></td>
    </tr>`).join('')}
    </tbody></table>`;
  }
  window.filterUsers = filterUsers;

  async function approveUser(id) {
    try {
      await api('/admin/users/' + id + '/approve', { method: 'PUT' });
      toast('已审核通过', 'ok');
      renderUsers();
    } catch (e) { toast(e.message, 'error'); }
  }
  window.approveUser = approveUser;

  async function banUser(id) {
    try {
      await api('/admin/users/' + id + '/ban', { method: 'PUT' });
      toast('已切换封禁状态', 'ok');
      renderUsers();
    } catch (e) { toast(e.message, 'error'); }
  }
  window.banUser = banUser;

  async function resetPwd(id) {
    if (!confirm('确认重置该用户密码？')) return;
    try {
      const r = await api('/admin/users/' + id + '/reset-password', { method: 'PUT' });
      toast(r.message || '密码已重置', 'ok');
    } catch (e) { toast(e.message, 'error'); }
  }
  window.resetPwd = resetPwd;

  function promptChangeId(id) {
    showModal(`
      <h3>修改用户 ID</h3>
      <p style="font-size:12px;color:var(--muted);margin-bottom:10px;">当前 ID：${esc(id)} · 请输入 6 位数字</p>
      <div class="form-group"><label>新 ID</label><input class="form-control" id="mNewId" placeholder="000011" inputmode="numeric" maxlength="6" /></div>
      <div class="row-btns">
        <button class="btn btn-ghost" onclick="closeModal()">取消</button>
        <button class="btn btn-primary" onclick="doChangeId('${id}')">确认</button>
      </div>
    `);
  }
  window.promptChangeId = promptChangeId;

  async function doChangeId(targetUserId) {
    const newId = ($('mNewId').value || '').trim();
    if (!newId) return toast('请输入新ID', 'error');
    try {
      await api('/admin/user-id', { method: 'PUT', body: JSON.stringify({ targetUserId, newId }) });
      closeModal();
      toast('ID 已修改', 'ok');
      renderUsers();
    } catch (e) { toast(e.message, 'error'); }
  }
  window.doChangeId = doChangeId;

  function deleteUserPrompt(id, isAdmin) {
    if (isAdmin) {
      showModal(`
        <h3>删除管理员</h3>
        <p style="font-size:13px;color:var(--muted);margin-bottom:10px;">需输入专用删除密码</p>
        <div class="form-group"><label>删除密码</label><input class="form-control" id="mDelPwd" type="password" /></div>
        <div class="row-btns">
          <button class="btn btn-ghost" onclick="closeModal()">取消</button>
          <button class="btn btn-danger" onclick="doDeleteUser('${id}',true)">确认删除</button>
        </div>
      `);
      return;
    }
    if (!confirm('确认永久删除用户 ' + id + '？')) return;
    doDeleteUser(id, false);
  }
  window.deleteUserPrompt = deleteUserPrompt;

  async function doDeleteUser(id, isAdmin) {
    try {
      const opts = { method: 'DELETE' };
      if (isAdmin) {
        const pwd = ($('mDelPwd') && $('mDelPwd').value) || '';
        if (!pwd) return toast('请输入删除密码', 'error');
        opts.body = JSON.stringify({ admin_delete_password: pwd });
      }
      await api('/admin/users/' + id, opts);
      closeModal();
      toast('已删除', 'ok');
      renderUsers();
    } catch (e) { toast(e.message, 'error'); }
  }
  window.doDeleteUser = doDeleteUser;

  async function renderOrders() {
    const box = $('pageContent');
    box.innerHTML = '<div class="empty">加载中...</div>';
    try {
      const orders = await api('/admin/orders');
      const list = Array.isArray(orders) ? orders : [];
      box.innerHTML = `
        <div class="card">
          <div class="card-title"><span>订单（${list.length}）</span><button class="btn btn-ghost btn-sm" onclick="renderOrders()">刷新</button></div>
          <div class="table-wrap">
            ${list.length === 0 ? '<div class="empty">暂无订单</div>' : `
            <table><thead><tr><th>标题</th><th>价格</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>
            ${list.slice(0, 200).map(o => `<tr>
              <td>${esc(o.title || o.id)}</td>
              <td>${o.price || 0}</td>
              <td><span class="badge badge-blue">${esc(o.status)}</span></td>
              <td style="font-size:11px;color:var(--muted)">${esc((o.created_at || '').slice(0, 19))}</td>
              <td class="actions">
                <button class="btn btn-ghost btn-sm" onclick="orderAction('${o.id}','cancel')">取消</button>
                <button class="btn btn-danger btn-sm" onclick="orderAction('${o.id}','delete')">删除</button>
              </td>
            </tr>`).join('')}
            </tbody></table>`}
          </div>
        </div>`;
    } catch (err) {
      box.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }
  window.renderOrders = renderOrders;

  async function orderAction(id, type) {
    try {
      if (type === 'cancel') {
        if (!confirm('确认取消订单？')) return;
        await api('/admin/orders/' + id + '/cancel', { method: 'PUT' });
      } else if (type === 'delete') {
        if (!confirm('确认删除订单？')) return;
        await api('/admin/orders/' + id, { method: 'DELETE' });
      }
      toast('操作成功', 'ok');
      renderOrders();
    } catch (e) { toast(e.message, 'error'); }
  }
  window.orderAction = orderAction;

  async function renderRecharges() {
    const box = $('pageContent');
    box.innerHTML = '<div class="empty">加载中...</div>';
    try {
      const list = await api('/admin/recharges');
      const arr = Array.isArray(list) ? list : [];
      box.innerHTML = `
        <div class="card">
          <div class="card-title"><span>充值申请（${arr.length}）</span><button class="btn btn-ghost btn-sm" onclick="renderRecharges()">刷新</button></div>
          <div class="table-wrap">
            ${arr.length === 0 ? '<div class="empty">暂无记录</div>' : `
            <table><thead><tr><th>用户</th><th>金额</th><th>红钻</th><th>状态</th><th>操作</th></tr></thead><tbody>
            ${arr.map(r => `<tr>
              <td>${esc(r.username || r.user_id)}</td>
              <td>¥${r.amount}</td>
              <td>${r.diamond}</td>
              <td>${r.status === 'pending' ? statusBadge('pending') : r.status === 'approved' ? statusBadge('active') : statusBadge('banned')}</td>
              <td class="actions">
                ${r.status === 'pending' ? `
                  <button class="btn btn-ok btn-sm" onclick="rechargeAct('${r.id}','approve')">通过</button>
                  <button class="btn btn-warn btn-sm" onclick="rechargeAct('${r.id}','reject')">拒绝</button>` : ''}
                <button class="btn btn-danger btn-sm" onclick="rechargeAct('${r.id}','delete')">删除</button>
              </td>
            </tr>`).join('')}
            </tbody></table>`}
          </div>
        </div>`;
    } catch (err) {
      box.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }
  window.renderRecharges = renderRecharges;

  async function rechargeAct(id, act) {
    try {
      if (act === 'approve') await api('/admin/recharges/' + id + '/approve', { method: 'PUT' });
      else if (act === 'reject') await api('/admin/recharges/' + id + '/reject', { method: 'PUT' });
      else if (act === 'delete') {
        if (!confirm('确认删除？')) return;
        await api('/admin/recharges/' + id, { method: 'DELETE' });
      }
      toast('操作成功', 'ok');
      renderRecharges();
    } catch (e) { toast(e.message, 'error'); }
  }
  window.rechargeAct = rechargeAct;

  async function renderWithdrawals() {
    const box = $('pageContent');
    box.innerHTML = '<div class="empty">加载中...</div>';
    try {
      const list = await api('/admin/withdrawals');
      const arr = Array.isArray(list) ? list : [];
      box.innerHTML = `
        <div class="card">
          <div class="card-title"><span>提现申请（${arr.length}）</span><button class="btn btn-ghost btn-sm" onclick="renderWithdrawals()">刷新</button></div>
          <div class="table-wrap">
            ${arr.length === 0 ? '<div class="empty">暂无记录</div>' : `
            <table><thead><tr><th>用户</th><th>数量</th><th>状态</th><th>时间</th><th>操作</th></tr></thead><tbody>
            ${arr.map(w => `<tr>
              <td>${esc(w.username || w.user_id)}</td>
              <td>${w.amount}</td>
              <td>${w.status === 'pending' ? statusBadge('pending') : w.status === 'approved' ? statusBadge('active') : statusBadge('banned')}</td>
              <td style="font-size:11px;color:var(--muted)">${esc((w.created_at || '').slice(0, 19))}</td>
              <td class="actions">
                ${w.status === 'pending' ? `
                  <button class="btn btn-ok btn-sm" onclick="withdrawAct('${w.id}','approve')">通过</button>
                  <button class="btn btn-warn btn-sm" onclick="withdrawAct('${w.id}','reject')">拒绝</button>` : ''}
                <button class="btn btn-danger btn-sm" onclick="withdrawAct('${w.id}','delete')">删除</button>
              </td>
            </tr>`).join('')}
            </tbody></table>`}
          </div>
        </div>`;
    } catch (err) {
      box.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }
  window.renderWithdrawals = renderWithdrawals;

  async function withdrawAct(id, act) {
    try {
      if (act === 'approve') await api('/admin/withdrawals/' + id + '/approve', { method: 'PUT' });
      else if (act === 'reject') await api('/admin/withdrawals/' + id + '/reject', { method: 'PUT', body: '{}' });
      else if (act === 'delete') {
        if (!confirm('确认删除？')) return;
        await api('/admin/withdrawals/' + id, { method: 'DELETE' });
      }
      toast('操作成功', 'ok');
      renderWithdrawals();
    } catch (e) { toast(e.message, 'error'); }
  }
  window.withdrawAct = withdrawAct;

  function renderDiamond() {
    $('pageContent').innerHTML = `
      <div class="card">
        <div class="card-title">赠送红钻</div>
        <div class="form-group"><label>用户 ID</label><input class="form-control" id="giftUid" placeholder="目标用户ID" /></div>
        <div class="form-group"><label>数量</label><input class="form-control" id="giftAmt" type="number" min="1" placeholder="红钻数量" /></div>
        <button class="btn btn-ok" onclick="doGiftDiamond()">确认赠送</button>
      </div>
      <div class="card">
        <div class="card-title">扣除红钻</div>
        <div class="form-group"><label>用户 ID</label><input class="form-control" id="deductUid" placeholder="目标用户ID" /></div>
        <div class="form-group"><label>数量</label><input class="form-control" id="deductAmt" type="number" min="1" placeholder="扣除数量" /></div>
        <div class="form-group"><label>原因（可选）</label><input class="form-control" id="deductReason" placeholder="原因" /></div>
        <button class="btn btn-danger" onclick="doDeductDiamond()">确认扣除</button>
      </div>
    `;
  }

  async function doGiftDiamond() {
    const targetUserId = ($('giftUid').value || '').trim();
    const amount = parseInt($('giftAmt').value, 10);
    if (!targetUserId || !amount) return toast('请填写完整', 'error');
    try {
      const r = await api('/admin/gift', { method: 'POST', body: JSON.stringify({ targetUserId, amount }) });
      toast(r.message || '赠送成功', 'ok');
    } catch (e) { toast(e.message, 'error'); }
  }
  window.doGiftDiamond = doGiftDiamond;

  async function doDeductDiamond() {
    const targetUserId = ($('deductUid').value || '').trim();
    const amount = parseInt($('deductAmt').value, 10);
    const reason = ($('deductReason').value || '').trim();
    if (!targetUserId || !amount) return toast('请填写完整', 'error');
    if (!confirm('确认扣除 ' + amount + ' 红钻？')) return;
    try {
      const r = await api('/admin/deduct', { method: 'POST', body: JSON.stringify({ targetUserId, amount, reason }) });
      toast(r.message || '已扣除', 'ok');
    } catch (e) { toast(e.message, 'error'); }
  }
  window.doDeductDiamond = doDeductDiamond;

  async function renderShops() {
    const box = $('pageContent');
    box.innerHTML = '<div class="empty">加载中...</div>';
    try {
      const list = await api('/shops');
      const arr = Array.isArray(list) ? list : [];
      box.innerHTML = `
        <div class="card">
          <div class="card-title"><span>店铺（${arr.length}）</span><button class="btn btn-ghost btn-sm" onclick="renderShops()">刷新</button></div>
          <div class="table-wrap">
            ${arr.length === 0 ? '<div class="empty">暂无店铺</div>' : `
            <table><thead><tr><th>名称</th><th>状态</th><th>自营</th><th>推荐</th><th>拥有者</th></tr></thead><tbody>
            ${arr.map(s => `<tr>
              <td>${esc(s.name)}</td>
              <td>${s.status === 'active' ? statusBadge('active') : statusBadge('banned')}</td>
              <td>${Number(s.is_self) === 1 ? '是' : '否'}</td>
              <td>${Number(s.is_recommend) === 1 ? '是' : '否'}</td>
              <td>${esc(s.owner_id || '-')}</td>
            </tr>`).join('')}
            </tbody></table>`}
          </div>
        </div>`;
    } catch (err) {
      box.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }
  window.renderShops = renderShops;

  async function renderProducts() {
    const box = $('pageContent');
    box.innerHTML = '<div class="empty">加载中...</div>';
    try {
      const list = await api('/admin/products');
      const arr = Array.isArray(list) ? list : [];
      box.innerHTML = `
        <div class="card">
          <div class="card-title"><span>商品（${arr.length}）</span><button class="btn btn-ghost btn-sm" onclick="renderProducts()">刷新</button></div>
          <div class="table-wrap">
            ${arr.length === 0 ? '<div class="empty">暂无商品</div>' : `
            <table><thead><tr><th>标题</th><th>价格</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody>
            ${arr.map(p => `<tr>
              <td>${esc(p.title)}</td>
              <td>${p.price}</td>
              <td>${(p.quantity || 0) - (p.sold || 0)}</td>
              <td>${esc(p.status || '-')}</td>
              <td class="actions">
                <button class="btn btn-ghost btn-sm" onclick="productAct('${p.id}','unshelf')">下架</button>
                <button class="btn btn-ok btn-sm" onclick="productAct('${p.id}','reshelf')">上架</button>
                <button class="btn btn-danger btn-sm" onclick="productAct('${p.id}','delete')">删除</button>
              </td>
            </tr>`).join('')}
            </tbody></table>`}
          </div>
        </div>`;
    } catch (err) {
      box.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }
  window.renderProducts = renderProducts;

  async function productAct(id, act) {
    try {
      if (act === 'unshelf') await api('/admin/products/' + id + '/unshelf', { method: 'PUT' });
      else if (act === 'reshelf') await api('/admin/products/' + id + '/reshelf', { method: 'PUT' });
      else if (act === 'delete') {
        if (!confirm('确认删除商品？')) return;
        await api('/admin/products/' + id, { method: 'DELETE' });
      }
      toast('操作成功', 'ok');
      renderProducts();
    } catch (e) { toast(e.message, 'error'); }
  }
  window.productAct = productAct;

  async function renderAnnounce() {
    const box = $('pageContent');
    box.innerHTML = '<div class="empty">加载中...</div>';
    try {
      const data = await api('/announce');
      box.innerHTML = `
        <div class="card">
          <div class="card-title">站点公告</div>
          <div class="form-group"><label>公告内容</label>
            <textarea class="form-control" id="annContent" rows="5">${esc(data.content || '')}</textarea>
          </div>
          <button class="btn btn-primary" onclick="saveAnnounce()">保存公告</button>
        </div>`;
    } catch (err) {
      box.innerHTML = `<div class="empty">${err.message}</div>`;
    }
  }
  window.renderAnnounce = renderAnnounce;

  async function saveAnnounce() {
    try {
      await api('/admin/announce', { method: 'PUT', body: JSON.stringify({ content: $('annContent').value }) });
      toast('公告已保存', 'ok');
    } catch (e) { toast(e.message, 'error'); }
  }
  window.saveAnnounce = saveAnnounce;

  function renderSettings() {
    $('pageContent').innerHTML = `
      <div class="card">
        <div class="card-title">API 连接</div>
        <div class="form-group"><label>主站地址</label>
          <input class="form-control" id="setApiBase" value="${esc(apiBase)}" placeholder="https://你的主站" />
        </div>
        <div class="toolbar">
          <button class="btn btn-primary" onclick="saveApiBase()">保存</button>
          <button class="btn btn-ghost" onclick="checkHealth().then(h=>toast(h?'API 正常':'API 异常',h?'ok':'error'))">测试连接</button>
        </div>
        <p style="font-size:12px;color:var(--muted);margin-top:10px;">当前：${esc(apiBase || location.origin)}</p>
      </div>
      <div class="card">
        <div class="card-title">关于</div>
        <p style="font-size:13px;color:var(--muted);line-height:1.6;">
          本控制终端为独立页面，通过主站 <code>/api</code> 接口管理 QW电竞平台。<br>
          仅 <b>admin</b> 角色可登录。删除管理员需密码 <code>@#555aaa</code>。
        </p>
      </div>
    `;
  }
  window.renderSettings = renderSettings;

  function saveApiBase() {
    apiBase = ($('setApiBase').value || '').trim().replace(/\/$/, '');
    localStorage.setItem(STORAGE_API, apiBase);
    $('topApi').textContent = apiBase || location.origin;
    toast('已保存 API 地址', 'ok');
    checkHealth();
  }
  window.saveApiBase = saveApiBase;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Enter key on login
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !$('loginPage').classList.contains('hidden')) doLogin();
  });

  // Boot
  $('apiBaseInput').value = apiBase;
  if (token && currentUser && currentUser.role === 'admin') {
    enterApp();
  } else {
    $('loginPage').classList.remove('hidden');
    $('app').classList.add('hidden');
  }
})();
</script>
</body>
</html>
