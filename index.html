<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>QW 控制终端</title>
<meta name="robots" content="noindex,nofollow" />
<style>
:root {
  --glass: rgba(255,255,255,.08);
  --glass-border: rgba(255,255,255,.18);
  --glass-strong: rgba(20,24,36,.55);
  --text: #f4f7fb;
  --muted: rgba(244,247,251,.62);
  --accent: #f6821f;
  --ok: #22c55e;
  --warn: #eab308;
  --danger: #ef4444;
  --sidebar-w: 240px;
  --radius: 14px;
  --blur: 24px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--text); background: #0a0c12; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
a { color: #93c5fd; }
#bgLayer {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(246,130,31,.25), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(59,130,246,.2), transparent 50%),
    radial-gradient(800px 600px at 50% 100%, rgba(139,92,246,.15), transparent 50%),
    linear-gradient(160deg, #0b1020 0%, #12182a 40%, #0a0e18 100%);
  background-size: cover; background-position: center;
}
#bgLayer::after { content:''; position:absolute; inset:0; background:rgba(0,0,0,.25); pointer-events:none; }
#appShell, #loginPage { position: relative; z-index: 1; }
.glass-strong {
  background: var(--glass-strong); border: 1px solid var(--glass-border);
  backdrop-filter: blur(28px) saturate(150%); -webkit-backdrop-filter: blur(28px) saturate(150%);
  border-radius: var(--radius);
  box-shadow: 0 12px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.1);
}
#loginPage { min-height: 100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.login-card { width:100%; max-width:420px; padding:28px 26px 24px; }
.login-card .logo {
  width:44px; height:44px; border-radius:12px;
  background: linear-gradient(135deg,#f6821f,#ff9f4a);
  display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:14px;
  box-shadow: 0 8px 24px rgba(246,130,31,.35);
}
.login-card h1 { font-size:22px; font-weight:700; }
.login-card .sub { color:var(--muted); font-size:13px; margin:6px 0 20px; line-height:1.5; }
.fg { margin-bottom:12px; }
.fg label { display:block; font-size:12px; color:var(--muted); margin-bottom:6px; }
.fc {
  width:100%; padding:11px 13px; border-radius:10px;
  border:1px solid var(--glass-border); background:rgba(0,0,0,.25); outline:none;
}
.fc:focus { border-color:rgba(246,130,31,.7); box-shadow:0 0 0 3px rgba(246,130,31,.15); }
.btn {
  border:none; border-radius:10px; padding:10px 14px; cursor:pointer; font-weight:600; font-size:13px;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
.btn:disabled { opacity:.45; cursor:not-allowed; }
.btn-accent { background:linear-gradient(135deg,#f6821f,#ff9a3c); color:#1a0d00; }
.btn-blue { background:rgba(59,130,246,.9); color:#fff; }
.btn-ok { background:rgba(34,197,94,.85); color:#052e16; }
.btn-warn { background:rgba(234,179,8,.9); color:#1c1400; }
.btn-danger { background:rgba(239,68,68,.9); color:#fff; }
.btn-ghost { background:rgba(255,255,255,.06); border:1px solid var(--glass-border); color:var(--text); }
.btn-sm { padding:5px 9px; font-size:12px; border-radius:8px; }
.btn-block { width:100%; }
.err { color:#fca5a5; font-size:13px; min-height:18px; margin-top:8px; }
#appShell { display:flex; height:100vh; }
.sidebar {
  width:var(--sidebar-w); flex-shrink:0; display:flex; flex-direction:column;
  border-right:1px solid var(--glass-border);
  background:rgba(10,14,24,.45); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
}
.side-brand { padding:16px 14px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--glass-border); }
.side-brand .mark {
  width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#f6821f,#ffb06b);
  display:flex; align-items:center; justify-content:center; font-size:15px;
}
.side-brand .txt { font-size:13px; font-weight:700; line-height:1.25; }
.side-brand .txt small { display:block; font-weight:500; color:var(--muted); font-size:11px; }
.side-nav { flex:1; overflow-y:auto; padding:10px 8px; }
.nav-sec { font-size:10px; letter-spacing:.08em; color:var(--muted); padding:10px 10px 6px; font-weight:600; text-transform:uppercase; }
.nav-item {
  width:100%; text-align:left; display:flex; align-items:center; gap:10px;
  padding:9px 12px; margin-bottom:2px; border:none; border-radius:10px;
  background:transparent; color:var(--muted); cursor:pointer; font-size:13px;
}
.nav-item:hover { background:rgba(255,255,255,.06); color:var(--text); }
.nav-item.active {
  background:linear-gradient(90deg, rgba(246,130,31,.22), rgba(246,130,31,.08));
  color:#ffd2a6; border:1px solid rgba(246,130,31,.25);
}
.side-foot { padding:12px; border-top:1px solid var(--glass-border); font-size:12px; color:var(--muted); }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar {
  display:flex; align-items:center; justify-content:space-between; padding:12px 18px;
  border-bottom:1px solid var(--glass-border); background:rgba(10,14,24,.35); backdrop-filter:blur(16px);
}
.topbar h2 { font-size:16px; font-weight:700; }
.topbar .meta { display:flex; align-items:center; gap:12px; font-size:12px; color:var(--muted); }
.dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
.dot.on { background:var(--ok); box-shadow:0 0 10px var(--ok); }
.dot.off { background:var(--danger); }
.content { flex:1; overflow:auto; padding:16px 18px 40px; }
.grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); margin-bottom:14px; }
.stat {
  padding:14px; border-radius:12px; background:rgba(255,255,255,.06);
  border:1px solid var(--glass-border); backdrop-filter:blur(12px);
}
.stat .l { font-size:11px; color:var(--muted); }
.stat .v { font-size:22px; font-weight:700; margin-top:4px; }
.card {
  padding:14px; margin-bottom:14px; border-radius:14px;
  background:rgba(255,255,255,.06); border:1px solid var(--glass-border); backdrop-filter:blur(16px);
}
.card-h { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; font-size:14px; font-weight:700; }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
.table-wrap { overflow:auto; max-height:calc(100vh - 220px); }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th, td { padding:9px 8px; text-align:left; border-bottom:1px solid rgba(255,255,255,.08); vertical-align:middle; }
th { color:var(--muted); font-weight:600; white-space:nowrap; position:sticky; top:0; background:rgba(15,18,28,.85); backdrop-filter:blur(8px); z-index:1; }
tr:hover td { background:rgba(255,255,255,.03); }
.badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:600; }
.b-ok { background:rgba(34,197,94,.18); color:#86efac; }
.b-warn { background:rgba(234,179,8,.18); color:#fde047; }
.b-danger { background:rgba(239,68,68,.18); color:#fca5a5; }
.b-muted { background:rgba(255,255,255,.08); color:var(--muted); }
.b-blue { background:rgba(59,130,246,.18); color:#93c5fd; }
.actions { display:flex; flex-wrap:wrap; gap:4px; }
.empty { text-align:center; color:var(--muted); padding:32px 12px; font-size:13px; }
.toast {
  position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(16px);
  padding:10px 16px; border-radius:10px; font-size:13px; z-index:9999;
  background:rgba(20,24,36,.92); border:1px solid var(--glass-border); backdrop-filter:blur(12px);
  opacity:0; transition:.25s; max-width:90vw;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.modal-mask {
  position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,.5); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal {
  width:100%; max-width:480px; max-height:90vh; overflow:auto; padding:18px; border-radius:16px;
  background:rgba(18,22,34,.88); border:1px solid var(--glass-border); backdrop-filter:blur(24px);
}
.modal h3 { margin-bottom:12px; font-size:16px; }
.row-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
.img-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.img-card {
  border-radius:12px; overflow:hidden; border:1px solid var(--glass-border);
  background:rgba(0,0,0,.25); position:relative;
}
.img-card img { width:100%; height:120px; object-fit:cover; display:block; background:#111; }
.img-card .meta { padding:6px 8px; font-size:10px; color:var(--muted); word-break:break-all; line-height:1.35; }
.img-card .ops { position:absolute; top:6px; right:6px; display:flex; gap:4px; }
.table-list { display:flex; flex-direction:column; gap:6px; max-height:70vh; overflow:auto; }
.table-item {
  display:flex; align-items:center; justify-content:space-between; padding:10px 12px;
  border-radius:10px; cursor:pointer; border:1px solid transparent; background:rgba(255,255,255,.04);
}
.table-item:hover, .table-item.active { border-color:rgba(246,130,31,.4); background:rgba(246,130,31,.1); }
.db-layout { display:grid; grid-template-columns:200px 1fr; gap:12px; min-height:60vh; }
@media (max-width:900px) {
  #appShell { flex-direction:column; }
  .sidebar { width:100%; height:auto; border-right:none; border-bottom:1px solid var(--glass-border); }
  .side-nav { display:flex; overflow-x:auto; padding:8px; gap:4px; }
  .nav-sec { display:none; }
  .nav-item { white-space:nowrap; flex-shrink:0; }
  .side-foot { display:none; }
  .db-layout { grid-template-columns:1fr; }
}
code { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; color:#fdba74; }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="loginPage">
  <div class="login-card glass-strong">
    <div class="logo">⚡</div>
    <h1>控制终端</h1>
    <p class="sub">液态玻璃管理台 · 全权限 · D1 / B2 / 业务数据</p>
    <div class="fg"><label>API 主站地址（可空=同域）</label>
      <input class="fc" id="apiBaseInput" placeholder="https://你的主站.pages.dev" /></div>
    <div class="fg"><label>管理员账号</label><input class="fc" id="loginUser" autocomplete="username" /></div>
    <div class="fg"><label>密码</label><input class="fc" id="loginPass" type="password" autocomplete="current-password" /></div>
    <button class="btn btn-accent btn-block" id="loginBtn" onclick="doLogin()">进入控制终端</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>
<div id="appShell" class="hidden">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="mark">⚡</div>
      <div class="txt">QW 控制终端<small>Workers 风格 · 最高权限</small></div>
    </div>
    <nav class="side-nav">
      <div class="nav-sec">概览</div>
      <button class="nav-item active" data-p="dashboard" onclick="go('dashboard')">📊 总览</button>
      <div class="nav-sec">业务</div>
      <button class="nav-item" data-p="users" onclick="go('users')">👥 用户</button>
      <button class="nav-item" data-p="orders" onclick="go('orders')">📋 订单</button>
      <button class="nav-item" data-p="recharges" onclick="go('recharges')">💎 充值</button>
      <button class="nav-item" data-p="withdrawals" onclick="go('withdrawals')">💰 提现</button>
      <button class="nav-item" data-p="diamond" onclick="go('diamond')">➕ 红钻</button>
      <button class="nav-item" data-p="shops" onclick="go('shops')">🏪 店铺</button>
      <button class="nav-item" data-p="products" onclick="go('products')">📦 商品</button>
      <button class="nav-item" data-p="announce" onclick="go('announce')">📢 公告</button>
      <div class="nav-sec">数据与存储</div>
      <button class="nav-item" data-p="d1" onclick="go('d1')">🗄️ D1 数据库</button>
      <button class="nav-item" data-p="b2" onclick="go('b2')">🖼️ B2 图库</button>
      <div class="nav-sec">系统</div>
      <button class="nav-item" data-p="appearance" onclick="go('appearance')">🎨 外观背景</button>
      <button class="nav-item" data-p="settings" onclick="go('settings')">⚙️ 设置</button>
    </nav>
    <div class="side-foot">
      <div id="sideUser">—</div>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px;" onclick="doLogout()">退出</button>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <h2 id="pageTitle">总览</h2>
      <div class="meta">
        <span><span class="dot" id="healthDot"></span> <span id="healthText">…</span></span>
        <span id="topApi" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></span>
      </div>
    </div>
    <div class="content" id="pageContent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<script src="./app.js"></script>
</body>
</html>
