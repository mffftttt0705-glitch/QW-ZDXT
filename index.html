<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>QW 控制终端</title>
<meta name="robots" content="noindex,nofollow" />
<style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --sidebar: #f8f9fb;
  --border: #e5e7eb;
  --text: #1a1d24;
  --muted: #6b7280;
  --hover: #eef0f4;
  --active: #e8edf5;
  --accent: #f6821f;
  --accent-soft: rgba(246,130,31,.12);
  --ok: #10b981;
  --warn: #f59e0b;
  --danger: #ef4444;
  --blue: #2563eb;
  --side-w: 260px;
  --top-h: 52px;
  --radius: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
.hidden { display: none !important; }
a { color: var(--blue); text-decoration: none; }

/* 可替换背景（可选叠加） */
#bgLayer {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: transparent;
  background-size: cover; background-position: center;
  opacity: .35;
}
#appRoot { position: relative; z-index: 1; height: 100%; }

/* ===== 登录 ===== */
#loginPage {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 20px; background: var(--bg);
}
.login-card {
  width: 100%; max-width: 400px; background: var(--panel);
  border: 1px solid var(--border); border-radius: 12px; padding: 28px 24px;
  box-shadow: 0 8px 30px rgba(0,0,0,.06);
}
.login-card .logo {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(135deg, #f6821f, #ff9f4a);
  display: flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 12px;
}
.login-card h1 { font-size: 20px; font-weight: 700; }
.login-card .sub { color: var(--muted); font-size: 13px; margin: 6px 0 18px; line-height: 1.5; }
.fg { margin-bottom: 12px; }
.fg label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.fc {
  width: 100%; padding: 10px 12px; border-radius: 8px;
  border: 1px solid var(--border); background: #fff; outline: none;
}
.fc:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.btn {
  border: none; border-radius: 8px; padding: 9px 14px; cursor: pointer;
  font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-accent { background: var(--accent); color: #fff; }
.btn-blue { background: var(--blue); color: #fff; }
.btn-ok { background: var(--ok); color: #fff; }
.btn-warn { background: var(--warn); color: #1c1400; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-ghost { background: #fff; border: 1px solid var(--border); color: var(--text); }
.btn-sm { padding: 5px 9px; font-size: 12px; }
.btn-block { width: 100%; }
.err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }

/* ===== 主壳：顶栏 + 抽屉侧栏 + 内容 ===== */
#appShell { height: 100%; display: flex; flex-direction: column; }

/* 顶栏：左上角展开图标 */
.topbar {
  height: var(--top-h);
  flex-shrink: 0;
  display: flex; align-items: center; gap: 12px;
  padding: 0 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  position: relative; z-index: 30;
}
.menu-btn {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--panel); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 4px;
}
.menu-btn:hover { background: var(--hover); }
.menu-btn span {
  display: block; width: 16px; height: 2px; background: var(--text); border-radius: 1px;
}
.topbar .brand {
  display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700;
}
.topbar .brand .mark {
  width: 22px; height: 22px; border-radius: 6px;
  background: linear-gradient(135deg, #f6821f, #ff9f4a);
  display: flex; align-items: center; justify-content: center; font-size: 12px;
}
.topbar .title { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.topbar .right {
  margin-left: auto; display: flex; align-items: center; gap: 12px;
  font-size: 12px; color: var(--muted);
}
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot.on { background: var(--ok); }
.dot.off { background: var(--danger); }

/* 遮罩：点右侧任意处收起侧栏 */
.side-mask {
  position: fixed; inset: 0; top: var(--top-h);
  background: rgba(15, 23, 42, .35);
  z-index: 40;
  opacity: 0; pointer-events: none;
  transition: opacity .2s ease;
}
.side-mask.open { opacity: 1; pointer-events: auto; }

/* 左侧抽屉：可展开功能列表 */
.sidebar {
  position: fixed;
  top: var(--top-h); left: 0; bottom: 0;
  width: var(--side-w);
  background: var(--sidebar);
  border-right: 1px solid var(--border);
  z-index: 50;
  transform: translateX(-105%);
  transition: transform .22s ease;
  display: flex; flex-direction: column;
  box-shadow: 4px 0 24px rgba(0,0,0,.08);
}
.sidebar.open { transform: translateX(0); }
.side-nav { flex: 1; overflow-y: auto; padding: 10px 8px 16px; }
.nav-sec {
  font-size: 11px; color: var(--muted); font-weight: 600;
  padding: 12px 12px 6px; letter-spacing: .02em;
}
.nav-item {
  width: 100%; text-align: left;
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; margin-bottom: 2px;
  border: none; border-radius: 8px;
  background: transparent; color: var(--text);
  cursor: pointer; font-size: 13.5px;
}
.nav-item:hover { background: var(--hover); }
.nav-item.active {
  background: var(--accent-soft);
  color: #c2410c;
  font-weight: 600;
}
.side-foot {
  padding: 12px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--muted);
}

/* 主内容区 */
.main {
  flex: 1; min-height: 0; overflow: auto;
  padding: 16px 18px 40px;
}
.page-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; gap: 10px; flex-wrap: wrap;
}
.page-head h2 { font-size: 18px; font-weight: 700; }

/* 组件 */
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); margin-bottom: 14px; }
.stat {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px;
}
.stat .l { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 22px; font-weight: 700; margin-top: 4px; }
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; margin-bottom: 14px;
}
.card-h {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px; margin-bottom: 12px; font-size: 14px; font-weight: 700;
}
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.table-wrap { overflow: auto; max-height: calc(100vh - 200px); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
th { color: var(--muted); font-weight: 600; font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: var(--panel); z-index: 1; }
tr:hover td { background: #fafbfc; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
.b-ok { background: #d1fae5; color: #065f46; }
.b-warn { background: #fef3c7; color: #92400e; }
.b-danger { background: #fee2e2; color: #991b1b; }
.b-muted { background: #f3f4f6; color: #6b7280; }
.b-blue { background: #dbeafe; color: #1e40af; }
.actions { display: flex; flex-wrap: wrap; gap: 4px; }
.empty { text-align: center; color: var(--muted); padding: 36px 12px; font-size: 13px; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(12px);
  padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 9999;
  background: #1f2937; color: #fff; opacity: 0; transition: .25s; max-width: 90vw;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.modal-mask {
  position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,.4);
  display: flex; align-items: center; justify-content: center; padding: 16px;
}
.modal {
  width: 100%; max-width: 440px; max-height: 90vh; overflow: auto;
  background: #fff; border-radius: 12px; padding: 18px; border: 1px solid var(--border);
}
.modal h3 { margin-bottom: 12px; font-size: 16px; }
.row-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
.img-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.img-card {
  border-radius: 10px; overflow: hidden; border: 1px solid var(--border);
  background: #fff; position: relative;
}
.img-card img { width: 100%; height: 120px; object-fit: cover; display: block; background: #f3f4f6; }
.img-card .meta { padding: 6px 8px; font-size: 10px; color: var(--muted); word-break: break-all; line-height: 1.35; }
.img-card .ops { position: absolute; top: 6px; right: 6px; display: flex; gap: 4px; }
.table-list { display: flex; flex-direction: column; gap: 4px; max-height: 70vh; overflow: auto; }
.table-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border-radius: 8px; cursor: pointer;
  border: 1px solid transparent; background: #fafbfc;
}
.table-item:hover, .table-item.active { border-color: var(--accent); background: var(--accent-soft); }
.db-layout { display: grid; grid-template-columns: 200px 1fr; gap: 12px; min-height: 50vh; }
@media (max-width: 800px) {
  .db-layout { grid-template-columns: 1fr; }
}
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: #c2410c; }
</style>
</head>
<body>
<div id="bgLayer"></div>
<div id="appRoot">

<!-- 登录 -->
<div id="loginPage">
  <div class="login-card">
    <div class="logo">⚡</div>
    <h1>控制终端</h1>
    <p class="sub">管理员登录 · 点击左上角图标展开全部功能</p>
    <div class="fg">
      <label>API 主站地址（可空=同域）</label>
      <input class="fc" id="apiBaseInput" placeholder="https://你的主站.pages.dev" />
    </div>
    <div class="fg"><label>管理员账号</label><input class="fc" id="loginUser" autocomplete="username" /></div>
    <div class="fg"><label>密码</label><input class="fc" id="loginPass" type="password" autocomplete="current-password" /></div>
    <button class="btn btn-accent btn-block" id="loginBtn" onclick="doLogin()">登录</button>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- 主界面：顶栏 + 抽屉 + 内容页 -->
<div id="appShell" class="hidden">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="展开菜单" title="展开功能菜单">
      <span></span><span></span><span></span>
    </button>
    <div class="brand">
      <div class="mark">⚡</div>
      <span>控制终端</span>
    </div>
    <span class="title" id="pageTitle">总览</span>
    <div class="right">
      <span><span class="dot" id="healthDot"></span> <span id="healthText">…</span></span>
      <span id="topUser"></span>
    </div>
  </header>

  <!-- 遮罩：点右侧任意地方收回 -->
  <div class="side-mask" id="sideMask"></div>

  <!-- 左侧可展开功能列表 -->
  <aside class="sidebar" id="sidebar">
    <nav class="side-nav" id="sideNav">
      <div class="nav-sec">概览</div>
      <button class="nav-item active" data-p="dashboard" type="button">📊 总览</button>
      <div class="nav-sec">业务管理</div>
      <button class="nav-item" data-p="users" type="button">👥 用户管理</button>
      <button class="nav-item" data-p="orders" type="button">📋 订单管理</button>
      <button class="nav-item" data-p="recharges" type="button">💎 充值审核</button>
      <button class="nav-item" data-p="withdrawals" type="button">💰 提现审核</button>
      <button class="nav-item" data-p="diamond" type="button">➕ 红钻操作</button>
      <button class="nav-item" data-p="shops" type="button">🏪 店铺列表</button>
      <button class="nav-item" data-p="products" type="button">📦 商品列表</button>
      <button class="nav-item" data-p="announce" type="button">📢 公告管理</button>
      <div class="nav-sec">数据与存储</div>
      <button class="nav-item" data-p="d1" type="button">🗄️ D1 数据库</button>
      <button class="nav-item" data-p="b2" type="button">🖼️ B2 图库</button>
      <div class="nav-sec">系统</div>
      <button class="nav-item" data-p="appearance" type="button">🎨 外观背景</button>
      <button class="nav-item" data-p="settings" type="button">⚙️ 设置</button>
    </nav>
    <div class="side-foot">
      <div id="sideUser">—</div>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:8px;" type="button" onclick="doLogout()">退出登录</button>
    </div>
  </aside>

  <main class="main" id="pageContent"></main>
</div>

</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<script src="./app.js"></script>
</body>
</html>
